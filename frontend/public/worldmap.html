<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World map — shared frame</title>
  <style>
    body { margin: 0; background: #0b1220; color: #cbd5e1;
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    header { padding: 12px 16px; display: flex; align-items: baseline; gap: 12px; }
    h1 { font-size: 15px; margin: 0; color: #e2e8f0; }
    .muted { color: #64748b; font-size: 12px; }
    #wrap { padding: 8px 16px 16px; }
    #map svg { width: 100%; height: auto; border: 1px solid #1e293b; border-radius: 10px; }
    #err { color: #f87171; font-size: 13px; padding: 24px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>World map</h1>
    <span class="muted">top-down · all cameras + tracked objects in one frame · refreshes 1&nbsp;Hz</span>
  </header>
  <div id="wrap"><div id="map"></div><div id="err"></div></div>
  <script>
    const map = document.getElementById("map");
    const err = document.getElementById("err");
    async function tick() {
      try {
        const r = await fetch("/api/worldmodel/scene.svg", { cache: "no-store" });
        if (r.status === 409) { err.textContent = "Not calibrated yet — run /ws/calibrate first."; map.innerHTML = ""; return; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        map.innerHTML = await r.text();
        err.textContent = "";
      } catch (e) {
        err.textContent = "backend unreachable: " + e.message;
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
