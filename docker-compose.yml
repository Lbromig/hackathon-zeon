# One command to bring the whole control stack up:
#
#   docker compose up            # http://localhost:5173
#   docker compose up --build    # after changing dependencies
#
# Both services bind-mount the repo and run in reload mode, so editing Python or
# Vue files takes effect without a rebuild.
#
# HARDWARE NOTE: the arms are reached over TCP by IP, which works from the default
# bridge network. USB devices (Opentrons serial, webcams) are NOT visible inside a
# container by default — see the commented blocks below. On macOS they cannot be
# passed through at all; run the backend on the host for that work.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Bench-specific settings (arm IPs, camera sources). Optional — core/config.py
      # falls back to its defaults when the file is absent.
      - path: .env
        required: false
    environment:
      # Absolute, because the container's working directory is /app, not the repo.
      HZ_TEACH_POSES_FILE: /app/data/teach_poses.json
      # Same reason as the frontend's VITE_USE_POLLING: a bind mount on Docker
      # Desktop delivers no inotify events, so --reload never fires without this.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Whole repo: the backend imports core/ and drivers/ as well as backend/.
      # Taught poses land in ./data on the host and survive `docker compose down`.
      - .:/app
    healthcheck:
      # No curl in python:slim — use the interpreter that is definitely there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

    # --- USB hardware (Linux hosts only) -----------------------------------
    # Opentrons over serial and/or USB cameras. Uncomment the devices you have;
    # compose fails to start if a listed device does not exist.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    #   - /dev/video0:/dev/video0
    #   - /dev/video1:/dev/video1

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Vite proxies /api and /ws here; inside the compose network the backend is
      # reachable by service name, not localhost.
      BACKEND_URL: http://backend:8000
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's Linux node_modules instead of the host's
      # macOS build of it — esbuild and friends ship platform-specific binaries.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
